<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O Nosso Amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(135deg, #fdfcfa, #f8eaea);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #b04545;
    }

    .timer {
      font-size: 1.4rem;
      margin-bottom: 40px;
      color: #5a4444;
      font-weight: 600;
    }

    .slider {
      width: 90%;
      max-width: 500px;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
      width: 100%;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
    }

    .dots {
      margin-top: 15px;
    }

    .dot {
      display: inline-block;
      height: 10px;
      width: 10px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
    }

    .active {
      background-color: #b04545;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>Para nunca te esqueceres do nosso dia até ao infinito</h1>
  <div class="timer" id="contador"></div>

  <div class="slider">
    <div class="slides" id="slides">
      <img src="IMG_20250211_165944_198.webp" alt="Foto 1">
      <img src="IMG_20250215_143408.jpg" alt="Foto 2">
      <img src="IMG_20250211_165944_653.jpg" alt="Foto 3">
    </div>
  </div>
  <div class="dots">
    <span class="dot active" onclick="mudarSlide(0)"></span>
    <span class="dot" onclick="mudarSlide(1)"></span>
    <span class="dot" onclick="mudarSlide(2)"></span>
  </div>

  <footer>
    Feito com amor para sempre
  </footer>

  <script>
    const inicio = new Date("2024-08-15T00:03:00");

    function atualizarContador() {
      const agora = new Date();
      const tempo = agora - inicio;

      const dias = Math.floor(tempo / (1000 * 60 * 60 * 24));
      const horas = Math.floor((tempo / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((tempo / (1000 * 60)) % 60);
      const segundos = Math.floor((tempo / 1000) % 60);

      document.getElementById("contador").textContent =
        `Juntos há ${dias} dias, ${horas}h ${minutos}m ${segundos}s`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();

    // Slide automático
    let slideIndex = 0;
    const slides = document.getElementById("slides");
    const dots = document.querySelectorAll(".dot");

    function mostrarSlide(index) {
      slideIndex = index;
      const largura = slides.clientWidth;
      slides.style.transform = `translateX(-${index * largura}px)`;

      dots.forEach(dot => dot.classList.remove("active"));
      dots[index].classList.add("active");
    }

    function autoSlide() {
      slideIndex = (slideIndex + 1) % 3;
      mostrarSlide(slideIndex);
    }

    setInterval(autoSlide, 5000);
    function mudarSlide(i) {
      mostrarSlide(i);
    }
  </script>

</body>
</html>
